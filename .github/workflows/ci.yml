name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Necessário para o Nx entender o histórico de mudanças

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm' # Ativa o cache nativo do npm no GitHub Actions
    
    - name: Install dependencies
      run: npm ci --prefer-offline --no-audit # Instalação mais rápida ignorando auditorias desnecessárias no CI
    
    - name: Nx Set SHAs
      uses: nrwl/nx-set-shas@v4 # Ajuda o Nx a comparar o commit atual com o último sucesso

    - name: Lint and Build Affected
      run: |
        npx nx affected:lint --parallel=3
        npx nx affected:build --parallel=3 --configuration=production